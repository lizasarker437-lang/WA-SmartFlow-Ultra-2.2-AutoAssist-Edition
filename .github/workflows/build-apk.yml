name: Build WA SmartFlow Ultra AutoAssist APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'WA-SmartFlow-Ultra-AutoAssist-Android.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 35
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        shell: bash
        run: |
          test -f WA-SmartFlow-Ultra-AutoAssist-Android.zip
          mkdir -p source
          unzip -q WA-SmartFlow-Ultra-AutoAssist-Android.zip -d source
          test -f source/WA-SmartFlow-Ultra-AutoAssist-Android/settings.gradle
          test -f source/WA-SmartFlow-Ultra-AutoAssist-Android/app/src/main/AndroidManifest.xml

      - name: Build debug APK
        shell: bash
        run: gradle -p source/WA-SmartFlow-Ultra-AutoAssist-Android --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WA-SmartFlow-Ultra-AutoAssist-APK
          path: source/WA-SmartFlow-Ultra-AutoAssist-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
