name: Build WA SmartFlow Ultra 2.5.1 FIXED APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'WA-SmartFlow-Ultra-2.5.1-FIXED-Android.zip'
      - 'WA-SmartFlow-Ultra-SmartReturn-Android.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android API 35
        shell: bash
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unpack project and apply confirmed Java compile fix
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source
          if [ -f WA-SmartFlow-Ultra-2.5.1-FIXED-Android.zip ]; then
            echo 'Using optional updated source ZIP.'
            unzip -q WA-SmartFlow-Ultra-2.5.1-FIXED-Android.zip -d source
          elif [ -f WA-SmartFlow-Ultra-SmartReturn-Android.zip ]; then
            echo 'Using previously uploaded SmartReturn ZIP; applying fix during build.'
            unzip -q WA-SmartFlow-Ultra-SmartReturn-Android.zip -d source
          else
            echo 'ERROR: Neither the existing SmartReturn ZIP nor the optional fixed ZIP was found in repository root.'
            exit 1
          fi
          python3 - <<'PYFIX'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root=Path('source/WA-SmartFlow-Ultra-SmartReturn-Android')
          java=root/'app/src/main/java/com/smartflow/ultra/ScheduleLaunchActivity.java'
          assert java.is_file(), f'Missing: {java}'
          source=java.read_text(encoding='utf8')
          old='AutoAssistState.queue(this,item,lockedAtDue)'
          new='AutoAssistState.queue(this,item,lockedAtDue,WhatsAppAssistService.previousAppPackage())'
          if old in source:
              java.write_text(source.replace(old,new),encoding='utf8')
              print('FIXED: ScheduleLaunchActivity.java 3-arg queue() -> 4-arg queue()')
          else:
              assert 'AutoAssistState.queue(this,item,lockedAtDue,' in source, 'Unexpected queue() call: review ScheduleLaunchActivity.java'
              print('PASS: queue() call is already fixed')
          state=(root/'app/src/main/java/com/smartflow/ultra/AutoAssistState.java').read_text(encoding='utf8')
          assert 'queue(Context c,JSONObject item,boolean wasLocked,String previousPackage)' in state
          for f in (root/'app/src/main').rglob('*.xml'):
              ET.parse(f)
          assert (root/'app/src/main/assets/index.html').exists()
          build=root/'app/build.gradle'
          data=build.read_text(encoding='utf8')
          if 'versionCode 6' in data:
              build.write_text(data.replace('versionCode 6','versionCode 7').replace('2.5.0-smartreturn-silenttimer','2.5.1-smartreturn-compilefix'),encoding='utf8')
          check=root/'check_source.py'
          if check.exists():
              import subprocess,sys
              subprocess.run([sys.executable,str(check)],check=True)
          print('Source preflight passed; starting Android compile.')
          PYFIX

      - name: Compile FIXED debug APK
        id: compile
        shell: bash
        run: |
          set -o pipefail
          gradle -p source/WA-SmartFlow-Ultra-SmartReturn-Android \
            --no-daemon --console=plain --warning-mode=none \
            :app:assembleDebug 2>&1 | tee build.log

      - name: Show compiler errors if build fails
        if: ${{ always() && steps.compile.outcome == 'failure' }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          lines=Path('build.log').read_text(encoding='utf8',errors='replace').splitlines()
          selected=set()
          for i,s in enumerate(lines):
              if re.search(r'(error:|AAPT:|What went wrong:|Execution failed for task|Could not (resolve|find)|FAILURE: Build failed)',s,re.I):
                  selected.update(range(max(0,i-3),min(len(lines),i+5)))
          report='\n'.join(f'{i+1}: {lines[i]}' for i in sorted(selected))[:25000]
          if not report: report='\n'.join(lines[-80:])
          print(report)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf8') as f:
              f.write('## Java compilation errors\n\n```text\n'+report.replace('```','` ` `')+'\n```\n')
          PY

      - name: Upload build log
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: SmartFlow-2.5.1-Build-Log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload APK
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: WA-SmartFlow-Ultra-2.5.1-APK
          path: source/WA-SmartFlow-Ultra-SmartReturn-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
