name: Build WA SmartFlow Ultra SmartReturn APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'WA-SmartFlow-Ultra-SmartReturn-Android.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK (avoid removed tools package)
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android API 35
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail
          test -f WA-SmartFlow-Ultra-SmartReturn-Android.zip
          mkdir -p extracted
          unzip -q WA-SmartFlow-Ultra-SmartReturn-Android.zip -d extracted
          test -f extracted/WA-SmartFlow-Ultra-SmartReturn-Android/settings.gradle

      - name: Build debug APK
        shell: bash
        run: gradle -p extracted/WA-SmartFlow-Ultra-SmartReturn-Android --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WA-SmartFlow-Ultra-SmartReturn-APK
          path: extracted/WA-SmartFlow-Ultra-SmartReturn-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
