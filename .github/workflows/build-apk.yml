name: Build WA SmartFlow Ultra SmartReturn APK - diagnostics

on:
  workflow_dispatch:
  push:
    paths:
      - 'WA-SmartFlow-Ultra-SmartReturn-Android.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android API 35
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project and verify files
        shell: bash
        run: |
          set -euo pipefail
          test -f WA-SmartFlow-Ultra-SmartReturn-Android.zip || { echo 'ERROR: Project ZIP not found in repository root'; exit 1; }
          mkdir -p source
          unzip -q WA-SmartFlow-Ultra-SmartReturn-Android.zip -d source
          test -f source/WA-SmartFlow-Ultra-SmartReturn-Android/settings.gradle || { echo 'ERROR: settings.gradle missing or wrong ZIP path'; exit 1; }
          test -f source/WA-SmartFlow-Ultra-SmartReturn-Android/app/build.gradle || { echo 'ERROR: app/build.gradle missing'; exit 1; }
          echo 'Java:'
          java -version
          echo 'Gradle:'
          gradle --version

      - name: Compile debug APK (save full log)
        id: build
        shell: bash
        run: |
          set -o pipefail
          gradle -p source/WA-SmartFlow-Ultra-SmartReturn-Android \
            --no-daemon --console=plain --stacktrace :app:assembleDebug 2>&1 | tee build.log

      - name: Show the real build error in job summary
        if: ${{ always() && steps.build.outcome == 'failure' }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          log = Path('build.log').read_text(encoding='utf-8', errors='replace').splitlines()
          start = next((i for i,line in enumerate(log) if line.strip() == '* What went wrong:'), None)
          error_lines = []
          if start is not None:
              for line in log[start:min(len(log),start+80)]:
                  if line.strip() in ('* Try:', '* Exception is:', '* Get more help at https://help.gradle.org.'):
                      break
                  error_lines.append(line)
          patterns = [r'\berror:',r'\bERROR:',r'AAPT:',r'Execution failed for task',r'Could not resolve',r'Could not find',r'Failed to',r'FAILURE:']
          matches = [f'{i+1}: {line}' for i,line in enumerate(log) if any(re.search(p,line,re.I) for p in patterns)]
          report = '\n'.join(error_lines + ['','Important matching lines:'] + matches[:60]).strip()
          if not report:
              report = '\n'.join(log[-90:])
          print('=== IMPORTANT ERROR SUMMARY ===')
          print(report[:20000])
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
              f.write('## APK build failure — relevant Gradle error\n\n')
              f.write('Open **Summary** for this run, or download the full `SmartFlow-Build-Log` artifact.\n\n')
              f.write('```text\n' + report[:20000].replace('```','` ` `') + '\n```\n')
          PY

      - name: Upload full build log (even on failure)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: SmartFlow-Build-Log
          path: build.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload APK (only on success)
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: WA-SmartFlow-Ultra-SmartReturn-APK
          path: source/WA-SmartFlow-Ultra-SmartReturn-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
