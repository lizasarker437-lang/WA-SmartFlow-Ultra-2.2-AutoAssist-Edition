name: Build SmartFlow Ultra PinAssist APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'WA-SmartFlow-Ultra-PinAssist-Android.zip'
      - '.github/workflows/build-apk.yml'
permissions:
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK (no removed tools package)
        uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android SDK API 35
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail
          test -f WA-SmartFlow-Ultra-PinAssist-Android.zip
          mkdir -p source
          unzip -q WA-SmartFlow-Ultra-PinAssist-Android.zip -d source
          test -f source/WA-SmartFlow-Ultra-PinAssist-Android/settings.gradle
      - name: Compile Debug APK
        run: gradle -p source/WA-SmartFlow-Ultra-PinAssist-Android --no-daemon --stacktrace :app:assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WA-SmartFlow-Ultra-PinAssist-APK
          path: source/WA-SmartFlow-Ultra-PinAssist-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
